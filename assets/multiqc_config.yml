# Report section order
report_section_order:
  "nf-core-abotyper-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-abotyper-summary":
    order: -1002

# Sample name handling
sample_names_replace:
  "_exon6": " (Exon 6)"
  "_exon7": " (Exon 7)"

# Sample names to ignore during processing
sample_names_ignore:
  - "_exon6"
  - "_exon7"

# Run only these modules
run_modules:
  - software_versions
  - fastqc
  - samtools

# Order of modules
module_order:
  - fastqc:
      name: "FastQC"
      comment: "This section aggregates quality check reports generated using fastqc for each sample reads."
      path_filters:
        - "*_fastqc.zip"
  - samtools:
      name: "Samtools Coverage"
      comment: "This section summarises coverage metrics for alignments."
      path_filters:
        - "*.coverage.txt"

# File name cleaning
extra_fn_clean_exts:
  - "_val"
  - "_fastqc"

# Table column visibility
table_columns_visible:
  fastqc:
    percent_duplicates: false
  samtools:
    coverage: true
    mean_coverage: true
    coverage_1x: true

# General settings
skip_generalstats: false
export_plots: true
disable_version_detection: true
profile_runtime: true

# File patterns to ignore
ignore:
  - "versions.yml"
