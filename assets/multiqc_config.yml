title: "Molecular ABO typing"
subtitle: "Genotyping and phenotyping of ABO blood groups using Oxford Nanopore Long-read sequencing.<br>"
intro_text: >
  Third-generation sequencing (TGS), also known as long-read sequencing, has become a promising 
  tool in clinical and research laboratories because it delivers high-resolution results with 
  unmatched throughput. Specialised immunohematology laboratories currently employ sequencing-based 
  methods to characterise rare ABO blood group phenotypes that cannot be identified through serology 
  and genotyping methods. However, routine clinical application of these methods remains elusive 
  due to the absence of validated laboratory protocols and bioinformatics tools. We have developed 
  and validated a TGS-based workflow for comprehensive determination of the clinically relevant 
  ABO phenotypes from DNA isolated from buccal swabs or whole blood. The region spanning exons 2 
  to 7 of the <i>ABO</i> gene is amplified and sequenced on MinION 10.4.1 flow cells. Predicted 
  ABO phenotypes are determined based on single-nucleotide variants at <strong>c.261delG</strong> 
  (rs8176719), <strong>c.796C&gt;A</strong> (rs8176746), <strong>c.803G&gt;C</strong> (rs8176747), 
  <strong>c.802G&gt;A</strong> (rs41302905), and <strong>c.804_805insG</strong> (rs782782485). 
  These five variant positions enable comprehensive identification of all clinically relevant ABO 
  phenotypes (A, B, AB, and O) including A subtype differentiation (A1 and A2) and rare O subtypes. 
  Certain O subtypes lack the distinguishing c.261delG deletion and instead exhibit variations at 
  c.802G&gt;A and c.804_805insG, which differentiate them from A alleles sharing the same nucleotides 
  at c.261, c.796, and c.803. The approach provides a scalable and precise method for routine ABO 
  blood group screening and supports the development of pioneering bioinformatics tools suitable 
  for clinical and research application.

